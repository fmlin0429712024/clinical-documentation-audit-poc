# CI (Continuous Integration) — Phase 3, Stage A.
#
# What this file does: whenever someone opens or updates a pull request
# against `main`, GitHub spins up a fresh Ubuntu virtual machine (a
# "GitHub-hosted runner" — free and unlimited for public repos) and runs
# this repo's test suites on it, then throws that machine away.
#
# Stage B (the headless Claude Code PR review job, `claude-review`) was
# removed from this workflow on purpose: it calls the paid Anthropic API,
# which needs a funded account, and an unfunded key made CI go red for a
# billing reason rather than a code reason. The deterministic `test` job
# below is fully free — no AI, no judgment, a fixed script either exits 0
# or it doesn't.
#
# - `test` (Stage A) — this repo's existing test suites. Phase 1 + 1.5
#   are stdlib-only; Phase 2's Claude SDK suite skips its two live-API
#   tests whenever the API is unusable (no key, unauthenticated, or the
#   account has no credits) — see claude-sdk-audit/test_nondeterministic.py
#   — so the whole job runs and passes with zero paid dependencies.

name: CI

# Quoted "on" on purpose: unquoted `on:` is a known YAML gotcha — YAML 1.1
# parses bare on/off/yes/no as booleans, so an unquoted `on:` key silently
# becomes the boolean `true` under a strict parser. GitHub's own workflow
# parser tolerates it either way, but quoting avoids the trap.
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Copies this repo's code onto the runner's fresh VM. Without this
      # step, there'd be no files here to test at all.
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Phase 1 + Phase 1.5: stdlib-only, no install step needed.
      # Auto-discovery (not a hardcoded filename) on purpose: any file
      # matching tools/test_*.py runs automatically, so a future new test
      # file (like Phase 1.5's test_query_deterministic_rule_patient_domain.py
      # was) can never silently miss being wired into CI.
      - name: Run Phase 1 + Phase 1.5 tests (deterministic tools)
        run: python3 -m unittest discover -s tools -p "test_*.py" -v

      # Phase 2 uses uv for its own isolated dependencies (anthropic,
      # python-dotenv, pytest) — this installs the uv tool itself.
      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      # `uv sync` installs claude-sdk-audit's pinned dependencies from its
      # own pyproject.toml/uv.lock. The two live-API tests inside this
      # suite need a real key to run; ANTHROPIC_API_KEY is stored as a
      # GitHub Actions secret (Settings -> Secrets and variables -> Actions
      # on the repo), never committed to a file. The suite degrades to
      # skips (never failures) when the API is unusable — no key, 401, or
      # an unfunded account ("credit balance too low") — so this job stays
      # green without spending anything. If the account ever gets credits,
      # the same tests run for real with no further changes.
      - name: Run Phase 2 tests (Claude SDK)
        working-directory: claude-sdk-audit
        run: |
          uv sync
          uv run pytest -v
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
